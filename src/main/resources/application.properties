# App
spring.application.name=stock-simulator
server.port=8080

# MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/stock_simulator_db?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=UTF-8&useSSL=false&serverTimezone=Asia/Kolkata&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root1123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# SQL seed data
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8
spring.sql.init.data-locations=classpath:data.sql
spring.jpa.defer-datasource-initialization=true

# Thymeleaf
spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8

# JWT
app.jwt.secret=StockSimIndia2024SuperSecretKeyMustBe256BitsLongForHS256Algorithm!
app.jwt.expiration=86400000

# Scheduler
spring.task.scheduling.pool.size=5

# Logging
logging.level.com.stocksim=INFO
logging.level.org.springframework.security=WARN
