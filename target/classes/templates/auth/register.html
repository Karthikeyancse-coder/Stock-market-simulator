<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Register | StockSim India</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/main.css">
  <link rel="stylesheet" href="/css/animations.css">
</head>
<body>

  <div class="auth-wrapper">
    <!-- Left Hero -->
    <div class="auth-left">
      <div class="auth-brand-icon">📈</div>
      <h1 class="auth-brand-name">StockSim India</h1>
      <div class="auth-brand-tag">Risk-Free Market Simulation</div>
      
      <div class="auth-features">
        <div class="auth-feature">
          <div class="auth-feature-icon">₹</div>
          <span>Start with ₹1,00,000 virtual cash</span>
        </div>
        <div class="auth-feature">
          <div class="auth-feature-icon">⚡</div>
          <span>Real-time prices every 5 seconds</span>
        </div>
        <div class="auth-feature">
          <div class="auth-feature-icon">🏅</div>
          <span>Unlock achievements and badges</span>
        </div>
      </div>
    </div>

    <!-- Right Form -->
    <div class="auth-right">
      <div class="auth-card anim-card">
        <h2 class="auth-title">Create Account</h2>
        <p class="auth-subtitle">Get started with your virtual portfolio</p>
        
        <form id="register-form">
          <div class="form-group mb-3">
            <label class="form-label">Username</label>
            <input type="text" id="username" class="form-control" autocomplete="off" required>
          </div>
          <div class="form-group mb-3">
            <label class="form-label">Email Address</label>
            <input type="email" id="email" class="form-control" autocomplete="off" required>
          </div>
          <div class="form-group mb-3">
            <label class="form-label">Password</label>
            <input type="password" id="password" class="form-control" required minlength="6">
          </div>
          <div class="form-group mb-4">
            <label class="form-label">Confirm Password</label>
            <input type="password" id="confirm-password" class="form-control" required minlength="6">
          </div>
          <button type="submit" id="submit-btn" class="btn-auth">Register</button>
        </form>
        
        <div class="auth-link">
          Already have an account? <a href="/auth/login">Login here</a>
        </div>
      </div>
    </div>
  </div>

  <script src="/js/auth.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', redirectIfAuth);
    
    document.getElementById('register-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const pwd = document.getElementById('password').value;
      const confirm = document.getElementById('confirm-password').value;
      if (pwd !== confirm) {
        showToast('Passwords do not match', 'error');
        return;
      }
      
      const btn = document.getElementById('submit-btn');
      setLoading(btn, true);
      
      const payload = {
        username: document.getElementById('username').value,
        email: document.getElementById('email').value,
        password: pwd
      };
      
      try {
        const res = await fetch('/api/auth/register', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        const data = await res.json();
        
        if (data.success) {
          showToast('Registration successful! Redirecting...', 'success');
          setTimeout(() => window.location.href = '/auth/login', 1500);
        } else {
          showToast(data.message || 'Registration failed', 'error');
        }
      } catch (err) {
        showToast('Network error', 'error');
      } finally {
        setLoading(btn, false);
      }
    });
  </script>
</body>
</html>
