<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>
  <th:block th:replace="~{layout/base :: base('Badges | StockSim', ~{::content}, ~{::scripts})}">
    
    <div th:fragment="content" class="page-container">
      <div class="page-header d-flex justify-content-between align-items-end">
        <div>
          <h1 class="page-title">Achievements</h1>
          <div class="page-subtitle">Complete trading goals to unlock rare badges</div>
        </div>
        <div class="stat-value text-primary font-monospace" id="badge-count" style="font-size:24px">-- / --</div>
      </div>
      
      <div class="page-body">
        
        <div class="badges-grid" id="badges-grid">
          <!-- Rendered via JS -->
        </div>

      </div>
    </div>

    <th:block th:fragment="scripts">
      <script>
        document.addEventListener('DOMContentLoaded', () => {
          document.querySelector('a[href="/badges"]').classList.add('active');
          loadBadges();
        });
      </script>
      <script src="/js/badges.js"></script>
    </th:block>
    
  </th:block>
</body>
</html>
