<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:fragment="base(title, content, pageScripts)">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title th:text="${title}">StockSim India</title>
  
  <!-- Favicon -->
  <link rel="icon" type="image/png" href="/assets/logo.png">
  <link rel="apple-touch-icon" href="/assets/logo.png">

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  
  <!-- Bootstrap 5.3 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  
  <!-- Animate.css -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" rel="stylesheet">
  
  <!-- Chart.js + Financial + Date Adapter -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@3.9.1/dist/chart.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns@2.0.0/dist/chartjs-adapter-date-fns.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-chart-financial/dist/chartjs-chart-financial.min.js"></script>
  
  <!-- WebSocket -->
  <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1.6.1/dist/sockjs.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@stomp/stompjs@7.0.0/bundles/stomp.umd.min.js"></script>
  
  <!-- Confetti -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.2/dist/confetti.browser.min.js"></script>
  
  <!-- Custom CSS -->
  <link rel="stylesheet" href="/css/main.css">
  <link rel="stylesheet" href="/css/animations.css">
</head>
<body>

    <div class="app-layout">
      <!-- Sidebar -->
      <aside class="sidebar">
        <div class="sidebar-logo">
          <img src="/assets/logo.png" alt="StockSim Logo"
               style="width:44px;height:44px;object-fit:contain;border-radius:8px;flex-shrink:0">
          <div>
            <div class="logo-text">StockSim</div>
            <div class="logo-sub">India Simulator</div>
          </div>
        </div>
        
        <nav class="sidebar-nav">
          <div class="nav-section-label">Main</div>
          <a href="/dashboard" class="nav-item"><i class="bi bi-grid-1x2"></i> Dashboard</a>
          <a href="/portfolio" class="nav-item"><i class="bi bi-pie-chart"></i> Portfolio</a>
          <a href="/transactions" class="nav-item"><i class="bi bi-list-ul"></i> Transactions</a>
          <a href="/badges" class="nav-item"><i class="bi bi-award"></i> Badges</a>
        </nav>
        
        <div class="sidebar-footer">
          <div class="user-chip" onclick="clearAuth(); window.location.href='/auth/login'">
            <div class="user-avatar" id="sidebar-avatar">U</div>
            <div>
              <div class="user-name" id="sidebar-username">User</div>
              <div class="user-balance" id="sidebar-balance">₹0.00</div>
            </div>
            <i class="bi bi-box-arrow-right ms-auto text-muted" title="Logout"></i>
          </div>
        </div>
      </aside>

      <!-- Main Content -->
      <main class="main-content">
        <!-- Ticker Bar -->
        <div class="ticker-bar">
          <div class="ticker-track" id="ticker-track">
            <!-- Populated by JS -->
          </div>
        </div>

        <!-- Page Content -->
        <th:block th:replace="${content}" />
      </main>
    </div>

    <!-- Confirm Modal -->
    <div class="modal fade" id="confirmModal" tabindex="-1">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content" style="border-radius:var(--radius-md);border:none;box-shadow:var(--shadow-lg)">
          <div class="modal-header border-0 pb-0">
            <h5 class="modal-title fw-bold">Confirm Trade</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body text-center py-4">
            <div class="mb-3" style="font-size:18px">
              You are about to <strong id="modal-mode"></strong> <strong id="modal-qty"></strong> shares.
            </div>
            <div class="text-muted" style="font-size:14px">Total Amount</div>
            <div id="modal-total" style="font-size:32px;font-weight:700;font-family:var(--font-mono);color:var(--text-primary)">₹0.00</div>
          </div>
          <div class="modal-footer border-0 pt-0 justify-content-center">
            <button type="button" class="btn btn-outline" data-bs-dismiss="modal">Cancel</button>
            <button type="button" id="modal-confirm-btn" class="btn btn-primary px-4">Confirm execution</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Init JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/auth.js"></script>
    <script src="/js/ticker.js"></script>
    <script src="/js/websocket.js"></script>
    
    <script>
      // Offline Local Logo System
      function getLocalLogo(symbol) {
        // Attempt to fetch local asset matching the symbol
        return `/assets/logos/${symbol}.png`;
      }
      
      // Zero-API offline elegant fallback avatar generator
      function generateFallbackAvatar(symbol) {
        const letters = symbol.substring(0, 2).toUpperCase();
        
        // Hash for consistent color per symbol
        const colors = ['#0f172a', '#1e293b', '#334155', '#475569', '#1e1b4b', '#312e81', '#1e3a8a', '#172554', '#064e3b', '#14532d', '#450a0a', '#7f1d1d'];
        let sum = 0;
        for(let i=0; i<symbol.length; i++) sum += symbol.charCodeAt(i);
        const color = colors[sum % colors.length];
        
        // Return pure SVG embedded as data URL (blazing fast, no dependencies)
        const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
          <rect width="100" height="100" fill="${color}"/>
          <text x="50" y="55" font-family="'DM Sans', -apple-system, sans-serif" font-weight="700" font-size="42" fill="#ffffff" text-anchor="middle" dominant-baseline="middle">${letters}</text>
        </svg>`;
        return 'data:image/svg+xml;utf8,' + encodeURIComponent(svg);
      }
      // Load user data in sidebar
      document.addEventListener('DOMContentLoaded', () => {
        if (!window.location.pathname.startsWith('/auth/')) {
          requireAuth(); // Guard
          const user = getUser();
          if(user && user.username) {
            document.getElementById('sidebar-username').textContent = user.username;
            document.getElementById('sidebar-avatar').textContent = user.username.charAt(0).toUpperCase();
            document.getElementById('sidebar-balance').textContent = formatINR(user.balance || 0);
          }
        }
      });
    </script>
    
    <!-- Page Specific Scripts -->
    <th:block th:replace="${pageScripts}" />

</body>
</html>
