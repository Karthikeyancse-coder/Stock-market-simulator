<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Dark background -->
  <rect width="512" height="512" rx="96" ry="96" fill="#0f172a"/>
  
  <!-- Upward trending chart line -->
  <polyline 
    points="72,340  152,280  220,300  290,200  370,160  440,100"
    fill="none" stroke="#22c55e" stroke-width="32" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Arrowhead at top right -->
  <polyline
    points="370,100  440,100  440,170"
    fill="none" stroke="#22c55e" stroke-width="32" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Baseline bar -->
  <line x1="72" y1="400" x2="440" y2="400" stroke="#1e293b" stroke-width="20" stroke-linecap="round"/>
  
  <!-- Volume bars (subtle, dark blue) -->
  <rect x="88"  y="360" width="28" height="40" rx="4" fill="#3b82f6" opacity="0.4"/>
  <rect x="148" y="340" width="28" height="60" rx="4" fill="#3b82f6" opacity="0.4"/>
  <rect x="208" y="350" width="28" height="50" rx="4" fill="#3b82f6" opacity="0.4"/>
  <rect x="268" y="330" width="28" height="70" rx="4" fill="#22c55e" opacity="0.5"/>
  <rect x="328" y="310" width="28" height="90" rx="4" fill="#22c55e" opacity="0.5"/>
  <rect x="388" y="290" width="28" height="110" rx="4" fill="#22c55e" opacity="0.7"/>
</svg>
